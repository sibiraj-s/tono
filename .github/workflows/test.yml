# Runs the unit tests on every push to a branch (tags are handled by the release workflow).
name: Tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running test.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # matches gradle/gradle-daemon-jvm.properties
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install the Android SDK platform
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
