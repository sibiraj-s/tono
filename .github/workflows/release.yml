# Builds a signed release APK and publishes it as a GitHub Release.
# Tono's "Check for updates" reads the latest release from this repo.
#
# Release a version either way:
#   git tag v0.3.0 && git push origin v0.3.0
#   or Actions › Release APK › Run workflow, and type the version.
#
# Needs these repository secrets (scripts/set-release-secrets.sh sets them from your local key):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT_VERSION#v}"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::Version must look like 1.2.3 (minor and patch up to 99), got '$v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # matches gradle/gradle-daemon-jvm.properties
          cache: gradle # caches Gradle dependencies and the wrapper between runs

      - uses: android-actions/setup-android@v4

      - name: Install the Android SDK platform
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Run scripts/set-release-secrets.sh to add them."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > tono-release.jks
          {
            echo "storeFile=tono-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -Ptono.version=${{ steps.version.outputs.version }}

      - name: Check the APK is signed with the release key
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed APK was built"; exit 1; }
          # Capture first: piping into grep -m1 can kill apksigner mid-write and fail the step under pipefail.
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          printf '%s\n' "$certs" | grep "certificate SHA-256"
          cp "$apk" "tono-${{ steps.version.outputs.version }}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" "tono-$V.apk" --clobber
          else
            gh release create "v$V" "tono-$V.apk" --title "Tono $V" --generate-notes --target "$GITHUB_SHA"
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f tono-release.jks keystore.properties
