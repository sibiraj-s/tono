# Releases are driven by Changesets (see .changeset/README.md):
#
#   1. Add a changeset with your change: `npx changeset`, then commit and push to master.
#   2. This workflow opens (or updates) a "release: vX.Y.Z" pull request that bumps the version in
#      package.json and writes CHANGELOG.md.
#   3. Merging that pull request tags vX.Y.Z, creates the GitHub release with the changelog, then
#      builds the signed APK and attaches it. Tono's "Check for updates" reads that release.
#
# Needs these repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Also enable Settings › Actions › General › "Allow GitHub Actions to create and approve pull requests".
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

# Each job asks for only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags tell Changesets what's already released
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump
      pull-requests: write # open the Version Packages pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      # The version the pending changesets bump to, for the pull request's title.
      - name: Work out the next version
        id: next
        run: |
          npx changeset status --output="$RUNNER_TEMP/status.json"
          echo "version=$(node -p "require('$RUNNER_TEMP/status.json').releases[0]?.newVersion ?? ''")" >> "$GITHUB_OUTPUT"

      - name: Open or update the release pull request
        uses: changesets/action/version@v2.1.2
        with:
          commit-message: "release: v${{ steps.next.outputs.version }}"
          pr-title: "release: v${{ steps.next.outputs.version }}"

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Tag and create the GitHub release
        id: publish
        uses: changesets/action/publish@v2.1.2
        with:
          create-github-releases: true

  apk:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # upload the APK to the release
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # matches gradle/gradle-daemon-jvm.properties
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install the Android SDK platform
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > tono-release.jks
          {
            echo "storeFile=tono-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Check the APK is signed with the release key
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed APK was built"; exit 1; }
          # Capture first: piping into grep -m1 can kill apksigner mid-write and fail the step under pipefail.
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          printf '%s\n' "$certs" | grep "certificate SHA-256"
          cp "$apk" "tono-$V.apk"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: gh release upload "v$V" "tono-$V.apk" --clobber

      - name: Remove the signing key
        if: always()
        run: rm -f tono-release.jks keystore.properties
